site_name: Muffin-OAuth
site_description: OAuth2 authorization for the Muffin framework
site_url: https://klen.github.io/muffin-oauth/
repo_url: https://github.com/klen/muffin-oauth
repo_name: klen/muffin-oauth
edit_uri: edit/develop/docs/

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Security: security.md
  - API reference: api.md
  - Development: development.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
